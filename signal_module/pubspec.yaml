name: signal_module
description: "Flutter module for Signal app add2app PoC"
publish_to: none

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  leancode_add2app:
    path: ../leancode_add2app

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  leancode_lint: ^17.0.0
  custom_lint: ^0.7.6

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/wallpapers/

  module:
    androidX: true
    androidPackage: co.leancode.signal_module
    iosBundleIdentifier: co.leancode.signalModule

name: inlay_compose
description: >
  Optional Jetpack Compose integration for the inlay framework - embed inlay
  Flutter screens directly into Compose navigation graphs. Android-only.
version: 0.2.0
repository: https://github.com/leancodepl/inlay
issue_tracker: https://github.com/leancodepl/inlay/issues
topics:
  - add-to-app
  - navigation
  - flutter-module
  - codegen
  - state
resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  inlay: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  leancode_lint: ^21.0.0

flutter:
  plugin:
    platforms:
      android:
        package: co.leancode.inlay.compose
        pluginClass: InlayComposePlugin

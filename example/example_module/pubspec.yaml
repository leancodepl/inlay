name: example_module
description: "Example Flutter module for inlay framework demo."
publish_to: none
resolution: workspace

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  auto_route: ^11.1.0
  cupertino_icons: ^1.0.8
  example_module_native:
    path: example_module_native/
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0
  flutter_localizations:
    sdk: flutter
  go_router: ^15.1.2
  inlay:
    path: ../../inlay
  inlay_compose:
    path: ../../inlay_compose
  package_info_plus: ^8.3.1

dev_dependencies:
  build_runner: ^2.11.0
  flutter_test:
    sdk: flutter
  inlay_gen:
    path: ../../inlay_gen
  leancode_lint: ^21.0.0
  pigeon: ^26.1.0

flutter:
  uses-material-design: true

  module:
    androidX: true
    androidPackage: co.leancode.example_module
    iosBundleIdentifier: co.leancode.exampleModule

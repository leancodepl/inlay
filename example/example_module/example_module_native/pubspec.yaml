name: example_module_native
description: >
  Companion plugin for example_module. Holds generated native code
  (Routes, Stores) so that flutter build aar / flutter build swift-package
  bundle them into binary artifacts.
publish_to: none
resolution: workspace

version: 0.1.0

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  inlay:
    path: ../../../inlay

flutter:
  plugin:
    platforms:
      android:
        package: co.leancode.example_module_native
        pluginClass: ExampleModuleNativePlugin
      ios:
        pluginClass: ExampleModuleNativePlugin

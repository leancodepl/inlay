name: signal_module_native
description: >
  Companion plugin for signal_module. Holds generated native code
  (Routes, Stores) so that flutter build aar bundles them into a binary artifact.
publish_to: none
resolution: workspace

version: 0.1.0

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  leancode_add2app:
    path: ../../leancode_add2app

flutter:
  plugin:
    platforms:
      android:
        package: co.leancode.signal_module_native
        pluginClass: SignalModuleNativePlugin
      ios:
        pluginClass: SignalModuleNativePlugin

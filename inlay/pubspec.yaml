name: inlay
description: >
  Embed Flutter in native iOS and Android apps with type-safe navigation and
  key-value storage synced in real time across engines and native code.
version: 0.1.1
repository: https://github.com/leancodepl/inlay
issue_tracker: https://github.com/leancodepl/inlay/issues
topics:
  - add-to-app
  - navigation
  - flutter-module
  - codegen
  - state
resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: '>=3.41.0'

dependencies:
  bloc: ^9.0.0
  flutter:
    sdk: flutter
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  leancode_lint: ^21.0.0
  pigeon: ^26.1.0

flutter:
  plugin:
    platforms:
      android:
        package: co.leancode.inlay
        pluginClass: InlayPlugin
      ios:
        pluginClass: InlayPlugin

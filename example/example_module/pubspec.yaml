name: example_module
description: "Example Flutter module for add2app framework demo."
publish_to: none
resolution: workspace

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  auto_route: ^11.1.0
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0
  go_router: ^15.1.2
  leancode_add2app:
    path: ../../leancode_add2app

dev_dependencies:
  build_runner: ^2.11.0
  flutter_test:
    sdk: flutter
  leancode_add2app_gen:
    path: ../../leancode_add2app_gen
  leancode_lint: ^21.0.0
  pigeon: ^26.1.0

flutter:
  uses-material-design: true

  module:
    androidX: true
    androidPackage: co.leancode.example_module
    iosBundleIdentifier: co.leancode.exampleModule

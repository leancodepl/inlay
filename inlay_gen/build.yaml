# build_runner configuration for inlay_gen
#
# This builder generates Dart, Kotlin, Java, and Swift code from inlay schema
# files. Schema files are specs (like Pigeon) - app code imports generated
# files only.

builders:
  inlay:
    import: "package:inlay_gen/builder.dart"
    builder_factories: ["inlayBuilder"]
    build_extensions:
      r"$lib$":
        - "src/generated/routes.g.dart"
        - "src/generated/stores.g.dart"
    auto_apply: dependents
    build_to: source
    # Route generators read source files that import the generated inlay
    # route classes, so the inlay outputs must exist before they run.
    runs_before:
      - "go_router_builder|go_router_builder"
      - "auto_route_generator|auto_route_generator"

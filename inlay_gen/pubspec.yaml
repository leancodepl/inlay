name: inlay_gen
description: >
  Code generator for the inlay add-to-app framework - produces type-safe
  route and store classes for Dart, Kotlin, and Swift from annotated schemas.
  Supports both CLI and build_runner.
version: 0.1.0
repository: https://github.com/leancodepl/inlay
issue_tracker: https://github.com/leancodepl/inlay/issues
topics:
  - add-to-app
  - navigation
  - flutter-module
  - codegen
  - state
resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  analyzer: ^10.0.0
  args: ^2.7.0
  build: ^4.0.0
  path: ^1.9.0
  yaml: ^3.1.2

dev_dependencies:
  build_test: ^3.0.0
  leancode_lint: ^21.0.0
  test: ^1.25.6

name: inlay
description: >
  A cross-platform framework for embedding Flutter in native apps. Provides
  navigation (push/pop via FlutterEngineGroup) and shared key-value storage
  with real-time synchronization across multiple Flutter isolates and native code.
version: 0.1.0
repository: https://github.com/leancodepl/inlay
issue_tracker: https://github.com/leancodepl/inlay/issues
topics:
  - add-to-app
  - navigation
  - flutter-module
  - codegen
  - state
resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: '>=3.41.0'

dependencies:
  bloc: ^9.0.0
  flutter:
    sdk: flutter
  meta: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  leancode_lint: ^21.0.0
  pigeon: ^26.1.0

flutter:
  plugin:
    platforms:
      android:
        package: co.leancode.inlay
        pluginClass: InlayPlugin
      ios:
        pluginClass: InlayPlugin

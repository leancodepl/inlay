name: signal_module
description: "Flutter module for Signal app add2app PoC"
publish_to: none
resolution: workspace

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  auto_route: ^11.1.0
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0
  go_router: ^15.1.2
  leancode_add2app:
    path: ../leancode_add2app
  signal_module_native:
    path: signal_module_native/

dev_dependencies:
  build_runner: ^2.11.0
  flutter_test:
    sdk: flutter
  leancode_add2app_gen:
    path: ../leancode_add2app_gen
  leancode_lint: ^21.0.0
  patrol:
    git:
      url: https://github.com/leancodepl/patrol.git
      ref: feature/adjust-patrol-to-add2app
      path: packages/patrol
  patrol_cli:
    git:
      url: https://github.com/leancodepl/patrol.git
      ref: feature/adjust-patrol-to-add2app
      path: packages/patrol_cli
  pigeon: ^26.1.0

patrol:
  app_name: Signal
  add_to_app: true
  android:
    package_name: org.thoughtcrime.securesms
    flavor: playProd
    native_project_path: ../Signal-Android

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/wallpapers/

  module:
    androidX: true
    androidPackage: co.leancode.signal_module
    iosBundleIdentifier: co.leancode.signalModule

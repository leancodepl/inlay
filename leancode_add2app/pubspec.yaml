name: leancode_add2app
description: >
  A cross-platform add2app framework for Flutter. Provides navigation
  (push/pop via FlutterEngineGroup) and shared key-value storage with
  real-time synchronization across multiple Flutter isolates and native code.
publish_to: none
resolution: workspace

version: 0.1.0

environment:
  sdk: ^3.11.0

dependencies:
  bloc: ^9.0.0
  flutter:
    sdk: flutter
  meta: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  leancode_lint: ^21.0.0
  pigeon: ^26.1.0

flutter:
  plugin:
    platforms:
      android:
        package: co.leancode.add2app
        pluginClass: LeanCodeAdd2AppPlugin
      ios:
        pluginClass: LeanCodeAdd2AppPlugin
